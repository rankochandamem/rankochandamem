<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180" role="img" aria-label="Orange cat and black cat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:'Quicksand','Nunito','Trebuchet MS',Verdana,sans-serif}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:swish 3.4s ease-in-out infinite}
@keyframes swish{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(11deg)}}
.ear{transform-box:fill-box;transform-origin:50% 100%}
.twitch{animation:twitch 6s infinite}
@keyframes twitch{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}94%{transform:rotate(4deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.tilta{transform-box:fill-box;transform-origin:50% 100%;animation:tilta 4s ease-in-out infinite}
@keyframes tilta{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.tiltb{transform-box:fill-box;transform-origin:50% 100%;animation:tiltb 4s ease-in-out infinite}
@keyframes tiltb{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
.ball{transform-box:fill-box;transform-origin:center;animation:rock 3s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
</style><defs><g id="paw">
  <ellipse cx="0" cy="7" rx="6.5" ry="5.5"/>
  <circle cx="-8" cy="-0.5" r="2.8"/><circle cx="-3" cy="-4.5" r="3"/>
  <circle cx="3" cy="-4.5" r="3"/><circle cx="8" cy="-0.5" r="2.8"/>
</g></defs>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker></defs>
<rect x="2" y="2" width="816" height="176" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
<path d="M110 62 H710" stroke="#c2410c" stroke-width="3" stroke-dasharray="6 7" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.6s" repeatCount="indefinite"/></path>
<path d="M736 62 C 790 62 790 150 710 150 H110 C 30 150 30 62 84 62" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="3 7" fill="none" marker-end="url(#arr)" opacity=".8"/>
<g>
  <circle cx="110" cy="62" r="26" fill="#fff" stroke="#f97316" stroke-width="2.5">
    <animate attributeName="r" values="26;30;26" dur="10s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(110,60) scale(1.15)" fill="#f97316"><use href="#paw"/></g>
  <text x="110" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2314">Idea</text>
</g><g>
  <circle cx="310" cy="62" r="26" fill="#fff" stroke="#1f2937" stroke-width="2.5">
    <animate attributeName="r" values="26;30;26" dur="10s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(310,60) scale(1.15)" fill="#1f2937"><use href="#paw"/></g>
  <text x="310" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2314">Build</text>
</g><g>
  <circle cx="510" cy="62" r="26" fill="#fff" stroke="#f97316" stroke-width="2.5">
    <animate attributeName="r" values="26;30;26" dur="10s" begin="5.0s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(510,60) scale(1.15)" fill="#f97316"><use href="#paw"/></g>
  <text x="510" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2314">Ship</text>
</g><g>
  <circle cx="710" cy="62" r="26" fill="#fff" stroke="#1f2937" stroke-width="2.5">
    <animate attributeName="r" values="26;30;26" dur="10s" begin="7.5s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(710,60) scale(1.15)" fill="#1f2937"><use href="#paw"/></g>
  <text x="710" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2314">Improve</text>
</g>
<g><animateMotion dur="11s" repeatCount="indefinite" path="M84 62 H736 C 790 62 790 150 710 150 H110 C 30 150 30 62 84 62" rotate="0"/><g><polygon points="-9.9,-4.4 -8.25,-17.05 -1.1,-9.35" fill="#fb923c" stroke="#c2410c" stroke-width=".8"/><polygon points="9.9,-4.4 8.25,-17.05 1.1,-9.35" fill="#fb923c" stroke="#c2410c" stroke-width=".8"/><circle cx="0" cy="0" r="11" fill="#fb923c" stroke="#c2410c" stroke-width=".8"/><circle cx="-4.18" cy="-1.1" r="2.2" fill="#84cc16"/><circle cx="4.18" cy="-1.1" r="2.2" fill="#84cc16"/><path d="M-1.65 3.08 L1.65 3.08 L0 4.95 Z" fill="#f472b6"/></g></g>
</svg>
