<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img" aria-label="Game-style interface for rankochandamem" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:'Segoe UI','Trebuchet MS','Helvetica Neue',Arial,sans-serif} .m{font-family:'Consolas','Courier New',monospace}</style><defs>
