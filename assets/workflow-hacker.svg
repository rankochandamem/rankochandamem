    </circle>
    <text x="710" y="75" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#d6ffe0">4</text>
    <text x="710" y="125" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#6ee787">Improve</text>
