<svg xmlns="http://www.w3.org/2000/svg" width="820" height="185" viewBox="0 0 820 185" role="img" aria-label="Workflow: idea, build, ship, improve, repeat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <path id="p" d="M110 70 H710" stroke="#0f5a1f" stroke-width="3" fill="none" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M710 96 C710 180 110 180 110 96" stroke="#00ff41" stroke-width="2" fill="none" stroke-dasharray="4 6" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <g>
    <circle cx="110" cy="70" r="26" fill="#0d1117" stroke="#00ff41" stroke-width="2">
      <animate attributeName="stroke" values="#0f5a1f;#00ff41;#0f5a1f" dur="8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="24;29;24" dur="8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="110" y="75" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#d6ffe0">1</text>
    <text x="110" y="125" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#6ee787">Idea</text>
  </g><g>
    <circle cx="310" cy="70" r="26" fill="#0d1117" stroke="#00ff41" stroke-width="2">
      <animate attributeName="stroke" values="#0f5a1f;#00ff41;#0f5a1f" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="24;29;24" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="310" y="75" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#d6ffe0">2</text>
    <text x="310" y="125" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#6ee787">Build</text>
  </g><g>
    <circle cx="510" cy="70" r="26" fill="#0d1117" stroke="#00ff41" stroke-width="2">
      <animate attributeName="stroke" values="#0f5a1f;#00ff41;#0f5a1f" dur="8s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="24;29;24" dur="8s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <text x="510" y="75" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#d6ffe0">3</text>
    <text x="510" y="125" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#6ee787">Ship</text>
  </g><g>
    <circle cx="710" cy="70" r="26" fill="#0d1117" stroke="#00ff41" stroke-width="2">
      <animate attributeName="stroke" values="#0f5a1f;#00ff41;#0f5a1f" dur="8s" begin="6s" repeatCount="indefinite"/>
