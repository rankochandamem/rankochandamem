      <animate attributeName="r" values="24;29;24" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="310" y="75" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#c9d1d9">2</text>
    <text x="310" y="125" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#8b949e">Build</text>
  </g><g>
    <circle cx="510" cy="70" r="26" fill="#0d1117" stroke="#58a6ff" stroke-width="2">
