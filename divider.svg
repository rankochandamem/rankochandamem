<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#238636" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#238636" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="6" width="900" height="2" rx="1"/></clipPath>
  </defs>
  <rect x="0" y="6" width="900" height="2" rx="1" fill="url(#g)"/>
  <g clip-path="url(#c)">
    <rect x="-200" y="5" width="200" height="4" fill="url(#glow)">
      <animate attributeName="x" from="-200" to="900" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="450" cy="7" r="3.5" fill="#58a6ff">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
